name: Rust checks
on: [push, pull_request]
jobs:
  portability:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-unknown-linux-gnu, aarch64-unknown-none, thumbv7em-none-eabihf]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --no-default-features -p apsis-core --lib --target ${{ matrix.target }}
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python -m pip install -r scripts/requirements-dev.txt
      - run: python -m black --check scripts
      - run: python -m ruff check scripts
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo test --workspace --release --locked
      - run: cargo run --release --locked -p apsis-cli
      - run: cargo run --release --locked -p apsis-core --example consumer
      - run: python scripts/embedded_evidence.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --release --locked -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo
          path: output/
