[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
nalgebra = { version = "0.33", default-features = false, features = ["libm"] }
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
apsis-core = { path = "crates/apsis-core" }
apsis-math = { path = "crates/apsis-math" }
apsis-sim = { path = "crates/apsis-sim" }
apsis-vision = { path = "crates/apsis-vision" }
apsis-ekf = { path = "crates/apsis-ekf" }
